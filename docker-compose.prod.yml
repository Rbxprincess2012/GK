# Боевой стек: бэкенд (api) + фронт/обратный прокси с авто-HTTPS (web/Caddy) + n8n.
# БД — внешний managed PostgreSQL (в compose не входит).
# Запускать ТОЛЬКО когда DNS putevo.su и n8n.putevo.su уже указывают на сервер
# (Caddy при старте выпускает сертификаты Let's Encrypt — нужны живые A-записи + порты 80/443).
#
# Команды (на сервере, из /opt/dispatcher):
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm api npm run migrate
#   docker compose -f docker-compose.prod.yml up -d
services:
  api:
    build: ./server
    image: dispatcher-api
    container_name: dispatcher-api
    restart: unless-stopped
    env_file: ./server/.env.production
    # Telegram доступен с этого сервера ТОЛЬКО по IPv4 — IPv6-маршрут до api.telegram.org
    # мёртв (таймаут), а резолвер отдаёт AAAA. Прибиваем имя к рабочему IPv4, иначе
    # getFile/скачивание медиа виснет. См. также bot.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    expose:
      - "3000"
    volumes:
      - media_data:/app/media     # медиа-пруф (общий с ботом; api отдаёт /media)

  # Водительский Telegram-бот: отдельный процесс, тот же образ.
  # Токен берётся из Настроек (БД), задаётся в админке. Long-polling, single-instance.
  # После смены токена в админке — перезапустить сервис: docker compose restart bot
  bot:
    build: ./server
    image: dispatcher-api
    container_name: dispatcher-bot
    restart: unless-stopped
    command: npm run bot
    env_file: ./server/.env.production
    # Telegram только по IPv4 (см. api): без этого long-polling getUpdates виснет —
    # резолвер отдаёт IPv6, а маршрут до него мёртв.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    depends_on:
      - api
    volumes:
      - media_data:/app/media

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: dispatcher-web
    container_name: dispatcher-web
    restart: unless-stopped
    depends_on:
      - api
    # Токен Timeweb API (JWT) для DNS-01. Лежит в /opt/dispatcher/.env
    # (TW_TOKEN=...), который compose читает автоматически. Не коммитим.
    environment:
      - TW_TOKEN=${TW_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data      # сертификаты Let's Encrypt (персистентно)
      - caddy_config:/config

  n8n:
    image: n8nio/n8n:latest
    container_name: dispatcher-n8n
    restart: unless-stopped
    depends_on:
      - api
    env_file: ./server/.env.n8n
    environment:
      - N8N_HOST=n8n.putevo.su
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.putevo.su/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=Europe/Moscow
      - TZ=Europe/Moscow
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
  media_data:

name: Deploy backend (отключён)

# SSH-деплой GitHub → сервер НЕ работает: трансграничная фильтрация (РФ) рвёт
# SSH-рукопожатие от раннеров GitHub до сервера Timeweb (handshake failed: EOF).
# Вместо него используется PULL-деплой на самом сервере: cron раз в 2 минуты
# запускает /opt/dispatcher/deploy.sh (git fetch + при изменениях rebuild).
# См. docs/deploy-timeweb.md. Этот workflow оставлен только для ручного запуска
# на случай, если в будущем появится доступный SSH-путь (напр. через прокси).

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Заглушка
        run: echo "SSH-деплой отключён. Используется pull-деплой на сервере (cron + /opt/dispatcher/deploy.sh)."
